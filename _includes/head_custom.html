<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<!-- This generates a little css line that sets the opacity to 0.5 for links that lead to is_wip pages -->
<!-- It also adds a little WIP label after the link -->
{% assign wip_pages = site.pages | where: "is_wip", true %}
{% if wip_pages.size > 0 %}
<style>
    {% for p in wip_pages %}
    .site-nav a[href="{{ p.url | relative_url }}"],
    .main-content a[href="{{ p.url | relative_url }}"]{% unless forloop.last %},{% endunless %}
    {% endfor %}
    {
    opacity: 0.5;
    &:hover {
        opacity: 1;
    };
    &::after {
        content: "WIP";
        margin-left: 0.5em;
        padding: 0.1em 0.45em;
        font-size: 0.65em;
        font-weight: 700;
        letter-spacing: 0.05em;
        border: 1px solid currentColor;
        border-radius: 4px;
        vertical-align: middle;
        position: relative;
        bottom: 0.1em;
    };
</style>
{% endif %}
